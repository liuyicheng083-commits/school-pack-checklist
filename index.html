<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>开学物品检查清单</title>
<style>
  :root {
    --text: #1a1d2a;
    --text-sub: rgba(26,29,42,.5);
    --primary: #7c5cf7;
    --primary-2: #5b8def;
    --danger: #f04b4b;
    --success: #1fce74;
    --glass: rgba(255,255,255,.32);
    --glass-strong: rgba(255,255,255,.5);
    --glass-card: rgba(255,255,255,.38);
    --glass-border: rgba(255,255,255,.55);
    --glass-border-soft: rgba(255,255,255,.3);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f4ff;
      --text-sub: rgba(242,244,255,.5);
      --primary: #9d7cff;
      --primary-2: #7ba3f7;
      --danger: #ff6b6b;
      --success: #3be08a;
      --glass: rgba(20,24,40,.38);
      --glass-strong: rgba(24,28,46,.55);
      --glass-card: rgba(255,255,255,.1);
      --glass-border: rgba(255,255,255,.2);
      --glass-border-soft: rgba(255,255,255,.1);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 0;
  }

  .bg {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1100px 760px at 10% -6%, #ffd6e6 0%, transparent 55%),
      radial-gradient(900px 680px at 110% 4%, #c8d6ff 0%, transparent 52%),
      radial-gradient(820px 640px at 94% 106%, #e0d0ff 0%, transparent 55%),
      radial-gradient(760px 580px at -6% 106%, #d2f0ff 0%, transparent 55%),
      linear-gradient(165deg, #edf0ff 0%, #f5eeff 55%, #edf6ff 100%);
  }
  @media (prefers-color-scheme: dark) {
    .bg {
      background:
        radial-gradient(1100px 760px at 10% -6%, rgba(120,60,120,.5) 0%, transparent 55%),
        radial-gradient(900px 680px at 110% 4%, rgba(60,80,180,.5) 0%, transparent 52%),
        radial-gradient(820px 640px at 94% 106%, rgba(100,60,170,.45) 0%, transparent 55%),
        radial-gradient(760px 580px at -6% 106%, rgba(40,100,140,.45) 0%, transparent 55%),
        linear-gradient(165deg, #13152a 0%, #191732 55%, #131c32 100%);
    }
  }
  .orb { position: fixed; border-radius: 50%; z-index: -1; filter: blur(65px); pointer-events: none; }
  .o1 { width: 420px; height: 420px; top: -110px; left: -80px; background: rgba(255,185,210,.5); }
  .o2 { width: 380px; height: 380px; top: 30%; right: -110px; background: rgba(145,175,255,.45); }
  .o3 { width: 460px; height: 460px; bottom: -140px; left: 16%; background: rgba(185,155,255,.45); }
  @media (prefers-color-scheme: dark) {
    .o1 { background: rgba(140,70,140,.45); }
    .o2 { background: rgba(65,95,210,.45); }
    .o3 { background: rgba(115,65,195,.45); }
  }
  body.has-custom-bg .orb { display: none; }

  .status-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 44px; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600; color: var(--text);
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
  }
  .status-bar .right { display: flex; align-items: center; gap: 5px; }
  .status-bar .signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .status-bar .signal span { width: 3px; background: var(--text); border-radius: 1px; }
  .status-bar .signal span:nth-child(1) { height: 4px; }
  .status-bar .signal span:nth-child(2) { height: 6px; }
  .status-bar .signal span:nth-child(3) { height: 8px; }
  .status-bar .signal span:nth-child(4) { height: 10px; }
  .status-bar .wifi { font-size: 13px; }
  .status-bar .battery {
    width: 24px; height: 12px; border: 1.5px solid var(--text); border-radius: 3px;
    position: relative; opacity: .8;
  }
  .status-bar .battery::after {
    content: ''; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px;
    background: var(--text); border-radius: 0 1px 1px 0; opacity: .8;
  }
  .status-bar .battery .fill {
    position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 75%;
    background: var(--text); border-radius: 1px;
  }

  .nav-bar {
    position: fixed; top: 44px; left: 0; right: 0; z-index: 99;
    height: 48px; display: flex; align-items: center; justify-content: center;
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid var(--glass-border-soft);
  }
  .nav-bar .nav-back {
    position: absolute; left: 16px; display: flex; align-items: center; gap: 2px;
    font-size: 17px; color: var(--primary); cursor: pointer; background: none; border: none;
    font-weight: 500;
  }
  .nav-bar .nav-back svg { width: 12px; height: 20px; stroke: var(--primary); stroke-width: 2.5; fill: none; }
  .nav-bar .nav-title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .nav-bar .nav-menu {
    position: absolute; right: 16px; background: none; border: none; font-size: 20px;
    color: var(--text-sub); cursor: pointer; padding: 4px 8px;
  }

  .main-wrap {
    padding-top: 100px;
    padding-bottom: 180px;
    max-width: 640px;
    margin: 0 auto;
  }

  .progress-card {
    margin: 12px 16px 0;
    background: var(--glass-card);
    backdrop-filter: blur(24px) saturate(170%);
    -webkit-backdrop-filter: blur(24px) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 8px 28px rgba(70,80,160,.14), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .progress-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .progress-count { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .progress-count .total { font-size: 14px; color: var(--text-sub); font-weight: 600; }
  .progress-pct { font-size: 15px; font-weight: 700; color: var(--primary); }
  .progress-track {
    height: 10px; background: rgba(255,255,255,.4); border-radius: 99px; overflow: hidden;
    border: 1px solid var(--glass-border-soft);
  }
  @media (prefers-color-scheme: dark) { .progress-track { background: rgba(255,255,255,.1); } }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    box-shadow: 0 0 10px rgba(124,92,247,.5);
    transition: width .35s ease;
  }

  .search-bar {
    margin: 14px 16px 0;
    display: flex; gap: 10px; align-items: center;
  }
  .search-input-wrap {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border-soft);
    border-radius: 14px; padding: 0 14px; height: 42px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }
  .search-input-wrap svg { width: 16px; height: 16px; stroke: var(--text-sub); stroke-width: 2; fill: none; flex-shrink: 0; }
  .search-input-wrap input {
    flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: var(--text);
    min-width: 0;
  }
  .search-input-wrap input::placeholder { color: var(--text-sub); }
  .filter-btn {
    height: 42px; padding: 0 16px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
    box-shadow: 0 5px 16px rgba(124,92,247,.35);
    flex-shrink: 0;
  }
  .filter-btn:active { transform: scale(.95); }

  .category-section { margin-top: 22px; padding: 0 16px; }
  .category-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 4px;
  }
  .category-name { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }
  .category-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
    background: rgba(240,75,75,.12); color: var(--danger); border: 1px solid rgba(240,75,75,.25);
  }
  .category-badge.done {
    background: rgba(31,206,116,.14); color: var(--success); border-color: rgba(31,206,116,.3);
  }
  .category-del {
    margin-left: auto; border: none; background: none; color: var(--text-sub); font-size: 15px;
    cursor: pointer; padding: 4px 8px;
  }
  .category-del:hover { color: var(--danger); }

  .item-group {
    background: var(--glass-card);
    backdrop-filter: blur(24px) saturate(170%);
    -webkit-backdrop-filter: blur(24px) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(70,80,160,.12), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .item-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--glass-border-soft);
    cursor: pointer; user-select: none;
    transition: background .12s ease;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:active { background: rgba(255,255,255,.25); }
  @media (prefers-color-scheme: dark) { .item-row:active { background: rgba(255,255,255,.08); } }

  .checkbox {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid rgba(120,130,170,.4);
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.25);
    transition: all .2s ease;
  }
  .item-row.checked .checkbox {
    background: linear-gradient(135deg, var(--success), #28e08d);
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(31,206,116,.4);
  }
  .checkbox svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none;
    stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .2s ease; }
  .item-row.checked .checkbox svg { stroke-dashoffset: 0; }

  .item-thumb {
    width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--glass-border-soft); box-shadow: 0 3px 10px rgba(70,80,160,.18);
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 500; word-break: break-all; }
  .item-row.checked .item-name { color: var(--text-sub); text-decoration: line-through; }
  .item-link-tag {
    display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--primary);
    margin-top: 2px; font-weight: 600;
  }
  .chevron { color: var(--text-sub); font-size: 14px; flex-shrink: 0; opacity: .6; }

  .celebrate {
    text-align: center; padding: 60px 20px;
  }
  .celebrate .icon {
    width: 72px; height: 72px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    border-radius: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; box-shadow: 0 10px 30px rgba(124,92,247,.35);
  }
  .celebrate .title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .celebrate .sub { font-size: 14px; color: var(--text-sub); }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-sub); font-size: 14px; }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }

  .add-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-top: 1px solid var(--glass-border-soft);
  }
  .add-bar-inner { max-width: 640px; margin: 0 auto; }
  .link-row {
    display: none; gap: 8px; align-items: center; margin-bottom: 8px;
    background: var(--glass); border: 1px solid var(--glass-border-soft);
    border-radius: 12px; padding: 8px 12px;
  }
  .link-row.show { display: flex; }
  .link-row input {
    flex: 1; border: none; outline: none; background: transparent; font-size: 14px;
    color: var(--text); min-width: 0;
  }
  .link-row input::placeholder { color: var(--text-sub); }
  .link-row .hint { font-size: 11px; color: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
  .add-row { display: flex; gap: 8px; align-items: center; }
  .add-cat {
    height: 46px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text); font-size: 13px; font-weight: 600;
    outline: none; max-width: 110px; flex-shrink: 0;
    backdrop-filter: blur(16px);
  }
  .new-cat-btn {
    height: 46px; padding: 0 10px; border-radius: 14px;
    border: 1px dashed rgba(124,92,247,.55); background: var(--glass);
    color: var(--primary); font-size: 12px; font-weight: 700; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .add-input {
    flex: 1; height: 46px; border: 1px solid var(--glass-border-soft); border-radius: 14px;
    padding: 0 16px; font-size: 15px; outline: none; color: var(--text); min-width: 0;
    background: rgba(255,255,255,.3);
  }
  .add-input::placeholder { color: var(--text-sub); }
  .add-input:focus { border-color: var(--primary); }
  @media (prefers-color-scheme: dark) { .add-input { background: rgba(255,255,255,.08); } }
  .link-toggle {
    width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--glass-border-soft);
    background: var(--glass); font-size: 18px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .link-toggle.active {
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    border-color: transparent; color: #fff;
  }
  .add-btn {
    width: 46px; height: 46px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(124,92,247,.4);
  }
  .add-btn:active { transform: scale(.93); }
  .home-indicator {
    width: 134px; height: 5px; background: var(--text); border-radius: 99px;
    margin: 8px auto 0; opacity: .25;
  }

  .detail-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    overflow-y: auto;
  }
  .detail-overlay.show { opacity: 1; pointer-events: auto; }
  .detail-inner { max-width: 640px; margin: 0 auto; padding-top: 100px; padding-bottom: 40px; min-height: 100vh; }
  .detail-cat-header {
    padding: 16px 20px 10px; font-size: 20px; font-weight: 800; letter-spacing: -.3px;
  }
  .detail-item-card {
    margin: 0 16px; background: var(--glass-card);
    backdrop-filter: blur(24px) saturate(170%);
    border: 1px solid var(--glass-border); border-radius: var(--radius);
    padding: 18px; box-shadow: 0 8px 28px rgba(70,80,160,.14), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .detail-item-top { display: flex; align-items: center; gap: 14px; }
  .detail-item-img {
    width: 80px; height: 80px; border-radius: 14px; object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--glass-border-soft); box-shadow: 0 4px 14px rgba(70,80,160,.2);
  }
  .detail-item-img-placeholder {
    width: 80px; height: 80px; border-radius: 14px; flex-shrink: 0;
    background: var(--glass); border: 1px dashed var(--glass-border-soft);
    display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer;
  }
  .detail-item-name { flex: 1; font-size: 18px; font-weight: 700; word-break: break-all; }
  .detail-checkbox {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(120,130,170,.4); background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: all .2s ease;
  }
  .detail-checkbox.checked {
    background: linear-gradient(135deg, var(--success), #28e08d); border-color: transparent;
    box-shadow: 0 3px 10px rgba(31,206,116,.4);
  }
  .detail-checkbox svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; }
  .detail-actions { display: flex; gap: 10px; margin-top: 16px; }
  .detail-action-btn {
    flex: 1; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .detail-action-btn.primary {
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    color: #fff; border-color: transparent;
  }
  .detail-action-btn.danger { color: var(--danger); }
  .detail-action-btn:active { transform: scale(.96); }
  .detail-section-title {
    padding: 22px 20px 8px; font-size: 14px; font-weight: 700; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .detail-other-list { margin: 0 16px; background: var(--glass-card);
    backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: var(--radius);
    overflow: hidden; box-shadow: 0 6px 22px rgba(70,80,160,.12), inset 0 1px 0 rgba(255,255,255,.55);
  }

  .bg-panel {
    position: fixed; top: 100px; right: 14px; z-index: 150;
    width: 260px; background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: 20px;
    box-shadow: 0 14px 44px rgba(70,80,160,.25), inset 0 1px 0 rgba(255,255,255,.65);
    padding: 16px; transition: opacity .18s ease, transform .18s ease;
  }
  .bg-panel.hidden { opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none; }
  .bg-panel h3 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .bg-panel .hint { font-size: 11px; color: var(--text-sub); line-height: 1.5; margin-top: 6px; }
  .bg-panel .row { display: flex; gap: 8px; margin-top: 10px; }
  .bg-panel .row input {
    flex: 1; min-width: 0; height: 38px; border-radius: 11px; border: 1px solid var(--glass-border-soft);
    background: rgba(255,255,255,.28); padding: 0 10px; font-size: 13px; color: var(--text); outline: none;
  }
  .bg-panel .row input::placeholder { color: var(--text-sub); }
  @media (prefers-color-scheme: dark) { .bg-panel .row input { background: rgba(255,255,255,.08); } }
  .bg-panel .btn {
    height: 38px; padding: 0 13px; border-radius: 11px; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .bg-panel .btn.primary { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; border-color: transparent; }
  .bg-panel .btn.block { width: 100%; margin-top: 10px; }
  .bg-panel .btn:active { transform: scale(.97); }
  .bg-opacity-wrap { margin-top: 12px; }
  .bg-opacity-wrap label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px; }
  .bg-opacity-wrap input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 99px;
    background: rgba(255,255,255,.35); outline: none;
  }
  .bg-opacity-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-2), var(--primary)); cursor: pointer;
    box-shadow: 0 2px 8px rgba(124,92,247,.4);
  }

  .bg-float-btn {
    position: fixed; top: 56px; right: 14px; z-index: 95;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--glass); backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border-soft); font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(70,80,160,.15), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .bg-float-btn:active { transform: scale(.92); }

  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,22,34,.8); color: #fff; font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 99px; opacity: 0; z-index: 300;
    backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.18);
    transition: all .25s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .reset-btn {
    display: block; margin: 28px auto 0; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text-sub); font-size: 13px; font-weight: 600;
    padding: 10px 22px; border-radius: 99px; cursor: pointer;
  }
  .reset-btn:hover { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 480px) {
    .status-bar { height: 40px; padding: 0 20px; font-size: 14px; }
    .nav-bar { top: 40px; height: 44px; }
    .nav-bar .nav-title { font-size: 16px; }

<script>
const DEFAULT_DATA = [
  { category: "📄 证件资料", items: [
    "身份证","学生证","校园卡/一卡通","银行卡","证件照（一寸/两寸）",
    "录取通知书/报到材料","团员证/党团材料","档案材料","体检报告"
  ]},
  { category: "🔌 电子产品", items: [
    "手机","手机充电器","数据线","充电宝","耳机",
    "笔记本电脑","电脑充电器","平板/电子书","U盘/硬盘","鼠标"
  ]},
  { category: "👕 衣物", items: [
    "换洗外套","日常衣物","睡衣","内衣裤","袜子","运动鞋","拖鞋","换季薄外套"
  ]},
  { category: "🧴 洗漱用品", items: [
    "牙刷","牙膏","洗面奶","洗发水","沐浴露","毛巾/浴巾","梳子","剃须刀/化妆包"
  ]},
  { category: "🛏️ 宿舍用品", items: [
    "床单被套","枕头","被子","枕头套","衣架","台灯","插线板","垃圾桶/垃圾袋","小锁"
  ]},
  { category: "✏️ 学习用品", items: [
    "笔记本","签字笔","课本/教材","文具袋","计算器","便利贴"
  ]},
  { category: "💊 药品", items: [
    "感冒药","肠胃药","创可贴","退烧药","常用药（个人）"
  ]},
  { category: "🧺 日常用品", items: [
    "水杯","雨伞","纸巾/湿巾","指甲剪","钥匙","口罩","收纳盒/收纳袋","饭盒/餐具"
  ]}
];

const STORAGE_KEY = "school-pack-checklist-v2";
let data = loadData();
let filterOnlyMissing = false;
let currentDetailKey = null;
let currentImageKey = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;" }[c]));
}
function normalizeUrl(u) {
  u = (u || "").trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed)) {
        parsed.forEach(g => {
          if (g.custom === undefined) g.custom = false;
          g.items.forEach(i => {
            if (i.link === undefined) i.link = null;
            if (i.image === undefined) i.image = null;
          });
        });
        return parsed;
      }
    }
  } catch(e) {}
  const d = DEFAULT_DATA.map(g => ({
    category: g.category, custom: false,
    items: g.items.map(n => ({ name: n, checked: false, link: null, image: null }))
  }));
  saveData(d);
  return d;
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function countAll() { return data.reduce((s,g) => s + g.items.length, 0); }
function countDone() { return data.reduce((s,g) => s + g.items.filter(i => i.checked).length, 0); }
function findItem(key) {
  const [cat, name] = key.split("||").map(decodeURIComponent);
  const group = data.find(g => g.category === cat);
  if (!group) return null;
  return { group, item: group.items.find(i => i.name === name) || null };
}
function populateSelect() {
  const sel = document.getElementById("addCategory");
  const prev = sel.value;
  sel.innerHTML = "";
  data.forEach(g => {
    const o = document.createElement("option");
    o.value = g.category; o.textContent = g.category;
    sel.appendChild(o);
  });
  if (prev && data.some(g => g.category === prev)) sel.value = prev;
}
function render() {
  const total = countAll(), done = countDone();
  const pct = total === 0 ? 0 : Math.round(done / total * 100);
  document.getElementById("doneCount").textContent = done;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
  populateSelect();
  const kw = document.getElementById("searchInput").value.trim().toLowerCase();
  const container = document.getElementById("listContainer");
  let html = "", anyVisible = false;
  data.forEach(group => {
    const filtered = group.items.filter(it => {
      if (filterOnlyMissing && it.checked) return false;
      if (kw && !it.name.toLowerCase().includes(kw)) return false;
      return true;
    });
    if (filtered.length === 0) return;
    anyVisible = true;
    const missing = filtered.filter(it => !it.checked).length;
    const allDone = missing === 0;
    const key = encodeURIComponent(group.category);
    html += '<div class="category-section">';
    html += '<div class="category-header">';
    html += '<span class="category-name">' + esc(group.category) + '</span>';
    html += '<span class="category-badge ' + (allDone ? "done" : "") + '">' +
            (allDone ? "✓ 已带齐" : "未带 " + missing) + '</span>';
    if (group.custom) html += '<button class="category-del" data-catdel="' + key + '" title="删除分类">✕</button>';
    html += '</div>';
    html += '<div class="item-group">';
    filtered.forEach(it => {
      const ikey = key + "||" + encodeURIComponent(it.name);
      html += '<div class="item-row ' + (it.checked ? "checked" : "") + '" data-key="' + ikey + '">';
      html += '<div class="checkbox"><svg viewBox="0 0 24 24"><polyline points="4,12 9,17 20,6"/></svg></div>';
      if (it.image) html += '<img class="item-thumb" src="' + esc(it.image) + '" alt="' + esc(it.name) + '" />';
      html += '<div class="item-info">';
      html += '<div class="item-name">' + esc(it.name) + '</div>';
      if (it.link) html += '<div class="item-link-tag">🔗 含链接</div>';
      html += '</div>';
      html += '<span class="chevron">›</span>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  if (!anyVisible) {
    const allChecked = countAll() > 0 && countDone() === countAll();
    if (allChecked) {
      html = '<div class="celebrate"><div class="icon">🎉</div>';
      html += '<div class="title">所有物品都带齐啦！</div>';
      html += '<div class="sub">可以安心出发 ~</div></div>';
    } else {
      html = '<div class="empty-state"><div class="big">🔍</div>没有符合条件的物品<br>试试换个关键词或取消筛选</div>';
    }
  }
  container.innerHTML = html;
  saveData();
}

document.getElementById("listContainer").addEventListener("click", e => {
  const catDel = e.target.closest(".category-del");
  if (catDel) {
    e.stopPropagation();
    const cat = decodeURIComponent(catDel.dataset.catdel);
    if (!confirm("删除分类「" + cat + "」及其全部物品？")) return;
    data = data.filter(g => g.category !== cat);
    populateSelect(); render(); showToast("已删除分类");
    return;
  }
  const row = e.target.closest(".item-row");
  if (row) {
    const key = row.dataset.key;
    const found = findItem(key);
    if (found && found.item) openDetail(key);
  }
});

function openDetail(key) {
  currentDetailKey = key;
  const found = findItem(key);
  if (!found || !found.item) return;
  const { group, item } = found;
  const overlay = document.getElementById("detailOverlay");
  const inner = document.getElementById("detailInner");
  let html = '<div class="detail-cat-header">' + esc(group.category) + '</div>';
  html += '<div class="detail-item-card">';
  html += '<div class="detail-item-top">';
  if (item.image) {
    html += '<img class="detail-item-img" src="' + esc(item.image) + '" alt="' + esc(item.name) + '" id="detailImg" />';
  } else {
    html += '<div class="detail-item-img-placeholder" id="detailImgPlaceholder">📷</div>';
  }
  html += '<div class="detail-item-name">' + esc(item.name) + '</div>';
  html += '<div class="detail-checkbox ' + (item.checked ? "checked" : "") + '" id="detailCheckbox">';
  html += '<svg viewBox="0 0 24 24"><polyline points="4,12 9,17 20,6"/></svg></div>';
  html += '</div>';
  html += '<div class="detail-actions">';
  html += '<button class="detail-action-btn ' + (item.link ? "primary" : "") + '" id="detailLinkBtn">' +
          (item.link ? "🔗 打开链接" : "＋ 添加链接") + '</button>';
  html += '<button class="detail-action-btn" id="detailEditBtn">✎ 编辑</button>';
  html += '<button class="detail-action-btn" id="detailImgBtn">🖼️ 图片</button>';
  html += '<button class="detail-action-btn danger" id="detailDelBtn">🗑 删除</button>';
  html += '</div></div>';
  const others = group.items.filter(i => i.name !== item.name);
  if (others.length > 0) {
    html += '<div class="detail-section-title">同分类其他物品</div>';
    html += '<div class="detail-other-list">';
    others.forEach(it => {
      const okey = encodeURIComponent(group.category) + "||" + encodeURIComponent(it.name);
      html += '<div class="item-row ' + (it.checked ? "checked" : "") + '" data-okey="' + okey + '">';
      html += '<div class="checkbox"><svg viewBox="0 0 24 24"><polyline points="4,12 9,17 20,6"/></svg></div>';
      if (it.image) html += '<img class="item-thumb" src="' + esc(it.image) + '" alt="" />';
      html += '<div class="item-info"><div class="item-name">' + esc(it.name) + '</div>';
      if (it.link) html += '<div class="item-link-tag">🔗 含链接</div>';
      html += '</div><span class="chevron">›</span></div>';
    });
    html += '</div>';
  }
  inner.innerHTML = html;
  overlay.classList.add("show");
  document.getElementById("navBack").style.visibility = "visible";
  document.getElementById("navTitle").textContent = "检查详情";
  document.getElementById("detailCheckbox").onclick = () => {
    item.checked = !item.checked;
    document.getElementById("detailCheckbox").classList.toggle("checked", item.checked);
    render();
    showToast(item.checked ? "已标记为已带" : "已取消标记");
  };
  document.getElementById("detailLinkBtn").onclick = () => {
    if (item.link) {
      window.open(item.link, "_blank", "noopener");
    } else {
      const url = prompt("粘贴物品链接（淘宝/参考网址）：", "");
      if (url && url.trim()) {
        item.link = normalizeUrl(url);
        openDetail(key); render(); showToast("链接已添加");
      }
    }
  };
  document.getElementById("detailEditBtn").onclick = () => {
    const newName = prompt("修改物品名称：", item.name);
    if (newName === null) return;
    const name = newName.trim();
    const newLink = prompt("物品链接（当前：" + (item.link || "无") + "，清空后点确定可移除）：", item.link || "");
    if (newLink === null) return;
    if (name) item.name = name;
    item.link = normalizeUrl(newLink);
    const newKey = encodeURIComponent(group.category) + "||" + encodeURIComponent(item.name);
    openDetail(newKey); render(); showToast("已更新");
  };
  document.getElementById("detailImgBtn").onclick = () => {
    currentImageKey = key;
    document.getElementById("itemImageFile").click();
  };
  const imgPh = document.getElementById("detailImgPlaceholder");
  if (imgPh) imgPh.onclick = () => { currentImageKey = key; document.getElementById("itemImageFile").click(); };
  const detailImg = document.getElementById("detailImg");
  if (detailImg) detailImg.onclick = () => { if (item.image) window.open(item.image, "_blank"); };
  document.getElementById("detailDelBtn").onclick = () => {
    if (!confirm("删除物品「" + item.name + "」？")) return;
    group.items.splice(group.items.indexOf(item), 1);
    closeDetail(); render(); showToast("已删除");
  };
  inner.querySelectorAll("[data-okey]").forEach(el => {
    el.onclick = () => { openDetail(el.dataset.okey); };
  });
}
function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("show");
  document.getElementById("navBack").style.visibility = "hidden";
  document.getElementById("navTitle").textContent = "开学物品检查清单";
  currentDetailKey = null;
}
document.getElementById("navBack").onclick = closeDetail;
document.getElementById("detailOverlay").addEventListener("click", e => {
  if (e.target.id === "detailOverlay") closeDetail();
});

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const scale = Math.min(1, maxDim / Math.max(width, height));
      width = Math.round(width * scale); height = Math.round(height * scale);
      const c = document.createElement("canvas");
      c.width = width; c.height = height;
      c.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("fail")); };
    img.src = url;
  });
}
document.getElementById("itemImageFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !currentImageKey) return;
  try {
    const data = await compressImage(file, 720, 0.72);
    const found = findItem(currentImageKey);
    if (found && found.item) {
      found.item.image = data;
      if (currentDetailKey) openDetail(currentDetailKey);
      render(); showToast("图片已添加");
    }
  } catch(err) { showToast("图片处理失败，请换一张"); }
  currentImageKey = null;
});

document.getElementById("filterBtn").onclick = () => {
  filterOnlyMissing = !filterOnlyMissing;
  const btn = document.getElementById("filterBtn");
  btn.textContent = filterOnlyMissing ? "显示全部" : "只显示未带";
  render();
};
document.getElementById("searchInput").addEventListener("input", render);

document.getElementById("linkToggle").onclick = () => {
  const row = document.getElementById("linkRow");
  const on = !row.classList.contains("show");
  row.classList.toggle("show", on);
  document.getElementById("linkToggle").classList.toggle("active", on);
  if (on) document.getElementById("addLink").focus();
};
document.getElementById("newCatBtn").onclick = () => {
  const name = prompt("输入新分类名称（如：零食、杂物）：");
  if (!name || !name.trim()) return;
  const n = name.trim();
  if (data.some(g => g.category === n)) { showToast("该分类已存在"); return; }
  data.push({ category: n, custom: true, items: [] });
  populateSelect();
  document.getElementById("addCategory").value = n;
  render(); showToast("已新建分类「" + n + "」");
};
document.getElementById("addBtn").onclick = addItem;
document.getElementById("addInput").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
document.getElementById("addLink").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
function addItem() {
  const input = document.getElementById("addInput");
  const name = input.value.trim();
  if (!name) { showToast("请输入物品名称"); return; }
  const cat = document.getElementById("addCategory").value;
  const link = normalizeUrl(document.getElementById("addLink").value);
  let group = data.find(g => g.category === cat);
  if (!group) { group = { category: cat, custom: false, items: [] }; data.push(group); }
  if (group.items.some(i => i.name === name)) { showToast("该物品已存在"); return; }
  group.items.push({ name, checked: false, link, image: null });
  input.value = ""; document.getElementById("addLink").value = "";
  document.getElementById("linkRow").classList.remove("show");
  document.getElementById("linkToggle").classList.remove("active");
  render(); showToast(link ? "已添加（含链接）：" + name : "已添加：" + name);
}

document.getElementById("resetBtn").onclick = () => {
  if (!confirm("确定重置所有勾选？物品列表保留，只清空勾选。")) return;
  data.forEach(g => g.items.forEach(i => i.checked = false));
  render(); showToast("已重置勾选");
};

document.getElementById("navMenu").onclick = () => {
  document.getElementById("bgPanel").classList.toggle("hidden");
};

const BG_KEY = "school-pack-bg-v2";
const bgEl = document.querySelector(".bg");
function applyBg(bg) {
  if (bg && bg.kind === "image") {
    bgEl.style.backgroundImage = 'url("' + bg.data + '")';
    bgEl.style.backgroundSize = "cover";
    bgEl.style.backgroundPosition = "center";
    bgEl.style.opacity = (bg.opacity || 100) / 100;
    document.body.classList.add("has-custom-bg");
  } else {
    bgEl.style.backgroundImage = "";
    bgEl.style.backgroundSize = "";
    bgEl.style.backgroundPosition = "";
    bgEl.style.opacity = "1";
    document.body.classList.remove("has-custom-bg");
  }
}
function saveBg(bg) { localStorage.setItem(BG_KEY, JSON.stringify(bg)); applyBg(bg); }
function loadBg() {
  try {
    const raw = localStorage.getItem(BG_KEY);
    if (raw) {
      const bg = JSON.parse(raw);
      if (bg && bg.kind === "image") {
        applyBg(bg);
        document.getElementById("bgOpacity").value = bg.opacity || 100;
        document.getElementById("bgOpacityVal").textContent = (bg.opacity || 100) + "%";
      }
    }
  } catch(e) {}
}
const bgPanel = document.getElementById("bgPanel");
document.getElementById("bgBtn").onclick = e => { e.stopPropagation(); bgPanel.classList.toggle("hidden"); };
document.addEventListener("click", e => {
  if (!bgPanel.classList.contains("hidden") && !e.target.closest("#bgPanel") &&
      !e.target.closest("#bgBtn") && !e.target.closest("#navMenu")) {
    bgPanel.classList.add("hidden");
  }
});
document.getElementById("bgUploadBtn").onclick = () => document.getElementById("bgFile").click();
document.getElementById("bgFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const data = await compressImage(file, 1600, 0.82);
    const opacity = parseInt(document.getElementById("bgOpacity").value);
    saveBg({ kind: "image", data, opacity });
    bgPanel.classList.add("hidden"); showToast("背景已更新");
  } catch(err) { showToast("图片处理失败"); }
});
document.getElementById("bgUrlApply").onclick = () => {
  const inp = document.getElementById("bgUrl");
  const url = inp.value.trim();
  if (!/^https?:\/\/[^\s"'<>\\]+$/i.test(url)) { showToast("请输入以 http(s):// 开头的图片链接"); return; }
  const opacity = parseInt(document.getElementById("bgOpacity").value);
  saveBg({ kind: "image", data: url, opacity });
  inp.value = ""; bgPanel.classList.add("hidden"); showToast("背景已更新");
};
document.getElementById("bgOpacity").addEventListener("input", e => {
  const val = parseInt(e.target.value);
  document.getElementById("bgOpacityVal").textContent = val + "%";
  try {
    const raw = localStorage.getItem(BG_KEY);
    if (raw) {
      const bg = JSON.parse(raw);
      if (bg && bg.kind === "image") { bg.opacity = val; saveBg(bg); }
    }
  } catch(e) {}
});
document.getElementById("bgReset").onclick = () => {
  localStorage.removeItem(BG_KEY);
  applyBg(null);
  document.getElementById("bgOpacity").value = 100;
  document.getElementById("bgOpacityVal").textContent = "100%";
  bgPanel.classList.add("hidden"); showToast("已恢复默认渐变");
};

function updateTime() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("statusTime").textContent = h + ":" + m;
}
updateTime();
setInterval(updateTime, 30000);

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
loadBg();
</script>
</body>
</html>
