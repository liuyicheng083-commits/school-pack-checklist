<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>开学物品检查清单</title>
<style>
  :root {
    --text: #1a1d2a;
    --text-sub: rgba(26,29,42,.58);
    --primary: #4f6ef7;
    --primary-2: #8a5cf7;
    --danger: #f04b4b;
    --success: #1fce74;
    --glass: rgba(255,255,255,.30);
    --glass-strong: rgba(255,255,255,.46);
    --glass-border: rgba(255,255,255,.58);
    --glass-border-soft: rgba(255,255,255,.34);
    --glass-shadow: 0 10px 30px rgba(70,80,160,.16), inset 0 1px 0 rgba(255,255,255,.65);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f4ff;
      --text-sub: rgba(242,244,255,.58);
      --primary: #7c96ff;
      --primary-2: #b18cff;
      --danger: #ff6b6b;
      --success: #3be08a;
      --glass: rgba(20,24,40,.34);
      --glass-strong: rgba(24,28,46,.5);
      --glass-border: rgba(255,255,255,.22);
      --glass-border-soft: rgba(255,255,255,.12);
      --glass-shadow: 0 12px 34px rgba(0,0,10,.35), inset 0 1px 0 rgba(255,255,255,.18);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 176px;
  }

  /* ===== 彩色背景 + 光斑 ===== */
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1200px 820px at 12% -8%, #ffd9e8 0%, transparent 55%),
      radial-gradient(1000px 720px at 108% 2%, #c9d8ff 0%, transparent 52%),
      radial-gradient(900px 700px at 92% 104%, #e2d4ff 0%, transparent 55%),
      radial-gradient(820px 620px at -8% 104%, #d3f3ff 0%, transparent 55%),
      linear-gradient(165deg, #eef1ff 0%, #f6f0ff 55%, #eef7ff 100%);
  }
  @media (prefers-color-scheme: dark) {
    .bg {
      background:
        radial-gradient(1200px 820px at 12% -8%, rgba(120,60,120,.55) 0%, transparent 55%),
        radial-gradient(1000px 720px at 108% 2%, rgba(60,80,180,.55) 0%, transparent 52%),
        radial-gradient(900px 700px at 92% 104%, rgba(100,60,170,.5) 0%, transparent 55%),
        radial-gradient(820px 620px at -8% 104%, rgba(40,100,140,.5) 0%, transparent 55%),
        linear-gradient(165deg, #14162b 0%, #1a1833 55%, #141d33 100%);
    }
  }
  .orb {
    position: fixed; border-radius: 50%; z-index: -1;
    filter: blur(70px); pointer-events: none;
  }
  .o1 { width: 460px; height: 460px; top: -130px; left: -90px; background: rgba(255,190,215,.55); }
  .o2 { width: 420px; height: 420px; top: 32%; right: -130px; background: rgba(150,180,255,.5); }
  .o3 { width: 500px; height: 500px; bottom: -160px; left: 18%; background: rgba(190,160,255,.5); }
  @media (prefers-color-scheme: dark) {
    .o1 { background: rgba(150,80,150,.5); }
    .o2 { background: rgba(70,100,220,.5); }
    .o3 { background: rgba(120,70,200,.5); }
  }

  /* ===== 顶部（玻璃） ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    padding: 24px 20px 16px;
    background: var(--glass);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-bottom: 1px solid var(--glass-border-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
  }
  header h1 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; }
  header .sub { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
  .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .progress-track {
    flex: 1; height: 12px; background: rgba(255,255,255,.5);
    border-radius: 99px; overflow: hidden;
    border: 1px solid var(--glass-border-soft);
  }
  @media (prefers-color-scheme: dark) { .progress-track { background: rgba(255,255,255,.12); } }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    border-radius: 99px;
    transition: width .35s ease;
    box-shadow: 0 0 12px rgba(120,140,255,.6);
  }
  .progress-num { font-size: 14px; font-weight: 700; white-space: nowrap; }

  /* ===== 工具条（玻璃） ===== */
  .toolbar {
    position: sticky;
    top: 135px; /* 由 JS 依据 header 实际高度动态同步 */
    z-index: 9;
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    padding: 12px 14px 10px;
    display: flex; gap: 10px;
    border-bottom: 1px solid var(--glass-border-soft);
  }
  .toolbar .search {
    flex: 1; display: flex; align-items: center;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border-radius: 16px; padding: 0 12px;
    border: 1px solid var(--glass-border-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }
  .toolbar .search input {
    flex: 1; border: none; outline: none; font-size: 15px; padding: 11px 8px;
    background: transparent; color: var(--text);
  }
  .toolbar .search input::placeholder { color: var(--text-sub); }
  .toolbar .search .icon { font-size: 15px; color: var(--text-sub); }
  .toolbar button {
    border: 1px solid var(--glass-border-soft); border-radius: 16px;
    font-size: 14px; font-weight: 700; padding: 0 16px; cursor: pointer;
    background: var(--glass); color: var(--text);
    backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }
  .toolbar button.filter-active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(110,120,255,.35);
  }

  /* ===== 清单（液态玻璃卡片） ===== */
  main { padding: 10px 14px 20px; }
  .category { margin-top: 18px; }
  .category-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 800; letter-spacing: -.2px;
    margin-bottom: 10px; padding: 0 6px;
  }
  .category-title .badge {
    font-size: 11px; font-weight: 700; color: var(--text-sub);
    background: var(--glass); border: 1px solid var(--glass-border-soft);
    border-radius: 99px; padding: 3px 10px;
    backdrop-filter: blur(16px);
  }
  .category-title .badge.all-done { background: rgba(31,206,116,.16); color: var(--success); border-color: rgba(31,206,116,.3); }
  .category-title .badge.has-missing { background: rgba(240,75,75,.12); color: var(--danger); border-color: rgba(240,75,75,.28); }
  .category-title .cat-del {
    margin-left: auto; border: none; background: transparent;
    color: var(--text-sub); font-size: 14px; cursor: pointer; padding: 4px 8px;
  }
  .category-title .cat-del:hover { color: var(--danger); }

  .item {
    display: flex; align-items: center; gap: 13px;
    background: linear-gradient(180deg, rgba(255,255,255,.52), rgba(255,255,255,.24));
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 15px 16px; margin-bottom: 10px;
    box-shadow: var(--glass-shadow);
    transition: transform .08s ease, box-shadow .15s ease;
    cursor: pointer; user-select: none;
  }
  .item:active { transform: scale(.975); }
  .item .box {
    width: 26px; height: 26px; flex-shrink: 0;
    border: 2px solid rgba(90,100,150,.4); border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.3);
    transition: all .2s ease;
  }
  .item.checked .box {
    background: linear-gradient(135deg, var(--success), #22e08b);
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(31,206,116,.4);
  }
  .item.checked .box svg { stroke-dasharray: 24; stroke-dashoffset: 0; }
  .item .name { font-size: 15px; flex: 1; word-break: break-all; font-weight: 500; }
  .item.checked .name { color: var(--text-sub); text-decoration: line-through; }
  .item .box svg {
    width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2;
    fill: none; stroke-dasharray: 24; stroke-dashoffset: 24;
    transition: stroke-dashoffset .2s ease;
  }
  .item .link-btn {
    border: 1px solid var(--glass-border-soft); background: rgba(255,255,255,.4);
    backdrop-filter: blur(14px);
    border-radius: 10px; font-size: 15px; padding: 5px 8px; cursor: pointer; flex-shrink: 0;
    line-height: 1;
  }
  .item .link-btn:active { background: rgba(255,255,255,.7); }
  .item .edit {
    border: none; background: transparent; font-size: 14px; color: var(--text-sub);
    padding: 4px 5px; cursor: pointer; flex-shrink: 0;
  }
  .item .edit:hover { color: var(--primary); }
  .item .del {
    border: none; background: transparent; font-size: 15px; color: var(--text-sub);
    padding: 4px 6px; cursor: pointer; flex-shrink: 0;
  }
  .item .del:hover { color: var(--danger); }
  @media (prefers-color-scheme: dark) {
    .item { background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06)); }
    .item .box { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.08); }
    .item .link-btn { background: rgba(255,255,255,.1); }
  }

  /* ===== 空状态 ===== */
  .empty {
    text-align: center; color: var(--text-sub); font-size: 14px; padding: 56px 20px;
  }
  .empty .big { font-size: 46px; margin-bottom: 12px; }
  .empty .highlight { color: var(--success); font-weight: 800; }

  /* ===== 底部悬浮玻璃 Dock ===== */
  .addbar {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow: 0 14px 44px rgba(70,80,160,.24), inset 0 1px 0 rgba(255,255,255,.7);
    padding: 12px;
  }
  .addbar-row1 { display: flex; gap: 8px; align-items: center; }
  .addbar-row2 {
    display: none; gap: 8px; align-items: center; margin-top: 9px;
    background: rgba(255,255,255,.22);
    backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border-soft);
    border-radius: 14px; padding: 8px 10px;
  }
  @media (prefers-color-scheme: dark) { .addbar-row2 { background: rgba(255,255,255,.08); } }
  .addbar-row2 .hint { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
  .add-select {
    border: 1px solid var(--glass-border-soft); border-radius: 16px;
    background: var(--glass); color: var(--text);
    padding: 0 8px; font-size: 14px; height: 48px; outline: none;
    max-width: 118px; flex-shrink: 0;
    backdrop-filter: blur(16px);
  }
  .newcat-btn {
    border: 1px dashed rgba(110,120,255,.6); border-radius: 16px;
    background: var(--glass); color: var(--primary); font-size: 13px; font-weight: 700;
    height: 48px; padding: 0 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    backdrop-filter: blur(16px);
  }
  .newcat-btn:active { background: var(--glass-strong); }
  .add-input {
    flex: 1; height: 48px; border: 1px solid var(--glass-border-soft); border-radius: 16px;
    padding: 0 14px; font-size: 15px; outline: none; color: var(--text); min-width: 0;
    background: rgba(255,255,255,.28);
    backdrop-filter: blur(16px);
  }
  .add-input::placeholder { color: var(--text-sub); }
  .add-input:focus { border-color: var(--primary); }
  @media (prefers-color-scheme: dark) { .add-input { background: rgba(255,255,255,.08); } }
  .link-toggle {
    width: 48px; height: 48px; flex-shrink: 0;
    border: 1px solid var(--glass-border-soft); border-radius: 16px;
    background: var(--glass); font-size: 18px; cursor: pointer;
    backdrop-filter: blur(16px);
  }
  .link-toggle.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent; color: #fff;
  }
  .link-input {
    flex: 1; height: 42px; border: 1px solid var(--glass-border-soft); border-radius: 12px;
    padding: 0 12px; font-size: 14px; outline: none; color: var(--text); min-width: 0;
    background: rgba(255,255,255,.28);
  }
  .link-input:focus { border-color: var(--primary); }
  @media (prefers-color-scheme: dark) { .link-input { background: rgba(255,255,255,.08); } }
  .add-btn {
    height: 48px; padding: 0 22px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 8px 22px rgba(110,120,255,.4);
  }
  .add-btn:active { transform: scale(.96); }

  .reset-btn {
    display: block; margin: 26px auto 0; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text-sub); font-size: 13px; font-weight: 600;
    padding: 11px 24px; border-radius: 99px; cursor: pointer;
    backdrop-filter: blur(18px);
  }
  .reset-btn:hover { color: var(--danger); border-color: var(--danger); }

  /* ===== toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 148px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,22,34,.78); color: #fff; font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 99px; opacity: 0;
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.18);
    transition: all .25s ease; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="orb o1" aria-hidden="true"></div>
<div class="orb o2" aria-hidden="true"></div>
<div class="orb o3" aria-hidden="true"></div>

<header>
  <h1>🎒 开学物品检查清单</h1>
  <div class="sub" id="dateLine"></div>
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-num" id="progressNum">0/0</div>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索物品…" />
  </div>
  <button id="filterBtn">只显示未带</button>
</div>

<main id="list"></main>

<button class="reset-btn" id="resetBtn">重置所有勾选</button>

<div class="addbar">
  <div class="addbar-row1">
    <select class="add-select" id="addCategory"></select>
    <button class="newcat-btn" id="newCatBtn" title="新建自己的分类">＋新分类</button>
    <input class="add-input" id="addInput" placeholder="添加物品，如：耳机" maxlength="30" />
    <button class="link-toggle" id="linkToggle" title="给物品添加链接">🔗</button>
    <button class="add-btn" id="addBtn">＋</button>
  </div>
  <div class="addbar-row2" id="linkRow">
    <input class="link-input" id="addLink" placeholder="粘贴物品链接（如淘宝/参考网址）" />
    <span class="hint">添加后点物品上的 🔗 可直接打开</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================= 预设清单 =================
const DEFAULT_DATA = [
  { category: "📄 证件资料", items: [
    "身份证", "学生证", "校园卡/一卡通", "银行卡", "证件照（一寸/两寸）",
    "录取通知书/报到材料", "团员证/党团材料", "档案材料", "体检报告"
  ]},
  { category: "🔌 电子产品", items: [
    "手机", "手机充电器", "数据线", "充电宝", "耳机",
    "笔记本电脑", "电脑充电器", "平板/电子书", "U盘/硬盘", "鼠标"
  ]},
  { category: "👕 衣物", items: [
    "换洗外套", "日常衣物", "睡衣", "内衣裤", "袜子",
    "运动鞋", "拖鞋", "换季薄外套"
  ]},
  { category: "🧴 洗漱用品", items: [
    "牙刷", "牙膏", "洗面奶", "洗发水", "沐浴露",
    "毛巾/浴巾", "梳子", "剃须刀/化妆包"
  ]},
  { category: "🛏️ 宿舍用品", items: [
    "床单被套", "枕头", "被子", "枕头套",
    "衣架", "台灯", "插线板", "垃圾桶/垃圾袋", "小锁"
  ]},
  { category: "✏️ 学习用品", items: [
    "笔记本", "签字笔", "课本/教材", "文具袋", "计算器", "便利贴"
  ]},
  { category: "💊 药品", items: [
    "感冒药", "肠胃药", "创可贴", "退烧药", "常用药（个人）"
  ]},
  { category: "🧺 日常用品", items: [
    "水杯", "雨伞", "纸巾/湿巾", "指甲剪", "钥匙", "口罩",
    "收纳盒/收纳袋", "饭盒/餐具"
  ]}
];

const STORAGE_KEY = "school-pack-checklist-v1";

// ================= 状态 =================
let data = loadData();
let filterOnlyMissing = false;

// ================= 工具 =================
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function normalizeUrl(u) {
  u = (u || "").trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}

// ================= 存储 =================
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed)) {
        // 迁移兼容旧版本数据
        parsed.forEach(g => {
          if (g.custom === undefined) g.custom = false;
          g.items.forEach(i => { if (i.link === undefined) i.link = null; });
        });
        return parsed;
      }
    }
  } catch (e) {}
  // 首次使用：生成默认数据
  const d = DEFAULT_DATA.map(g => ({
    category: g.category, custom: false,
    items: g.items.map(n => ({ name: n, checked: false, link: null }))
  }));
  saveData(d);
  return d;
}
function saveData(d) {
  const payload = d || data;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}

// ================= 分类下拉 =================
function populateSelect() {
  const sel = document.getElementById("addCategory");
  const prev = sel.value;
  sel.innerHTML = "";
  data.forEach(g => {
    const o = document.createElement("option");
    o.value = g.category;
    o.textContent = g.category;
    sel.appendChild(o);
  });
  if (prev && data.some(g => g.category === prev)) sel.value = prev;
}

// ================= 渲染 =================
function render() {
  const listEl = document.getElementById("list");
  const kw = document.getElementById("searchInput").value.trim().toLowerCase();
  const total = countAll();
  const done = countDone();

  // 进度
  document.getElementById("progressFill").style.width = total === 0 ? "0%" : (done / total * 100) + "%";
  document.getElementById("progressNum").textContent = done + "/" + total + (total - done > 0 ? " · 还有 " + (total - done) + " 件未带" : " · 全部带齐 ✅");

  populateSelect();

  let html = "";
  data.forEach(group => {
    const filtered = group.items.filter(it => {
      if (filterOnlyMissing && it.checked) return false;
      if (kw && !it.name.toLowerCase().includes(kw)) return false;
      return true;
    });
    if (filtered.length === 0) return;

    const missing = filtered.filter(it => !it.checked).length;
    const allDone = missing === 0;
    html += '<div class="category">';
    html += '<div class="category-title"><span>' + esc(group.category) + '</span>';
    html += '<span class="badge ' + (allDone ? "all-done" : "has-missing") + '">' +
            (allDone ? "✓ 已带齐" : "未带 " + missing + " 件") + '</span>';
    if (group.custom) {
      html += '<button class="cat-del" data-cat="' + encodeURIComponent(group.category) + '" title="删除该分类">✕</button>';
    }
    html += '</div>';

    filtered.forEach(it => {
      const key = encodeURIComponent(group.category) + "||" + encodeURIComponent(it.name);
      html += '<div class="item ' + (it.checked ? "checked" : "") + '" data-key="' + key + '">';
      html += '<div class="box"><svg viewBox="0 0 24 24"><polyline points="4,12 9,17 20,6"/></svg></div>';
      html += '<div class="name"></div>';
      if (it.link) {
        html += '<button class="link-btn" data-link="' + encodeURIComponent(it.link) + '" title="打开链接">🔗</button>';
      }
      html += '<button class="edit" data-edit="' + key + '" title="编辑名称/链接">✎</button>';
      html += '<button class="del" data-del="' + key + '">✕</button>';
      html += '</div>';
    });
    html += '</div>';
  });

  if (html === "") {
    const allChecked = total > 0 && done === total;
    html = '<div class="empty"><div class="big">' + (allChecked ? "🎉" : "🔍") + '</div>' +
           (allChecked ? '所有物品都带齐啦！<br><span class="highlight">可以安心出发~</span>'
                       : '没有符合条件的物品，试试换个关键词或取消筛选。') + '</div>';
  }
  listEl.innerHTML = html;

  // 填名字（避免 XSS：用 textContent 而非直接拼 html）
  listEl.querySelectorAll(".item .name").forEach(el => {
    const key = decodeURIComponent(el.parentElement.dataset.key);
    const name = key.split("||").pop();
    el.textContent = name;
  });

  saveData();
}

function countAll() {
  return data.reduce((s, g) => s + g.items.length, 0);
}
function countDone() {
  return data.reduce((s, g) => s + g.items.filter(i => i.checked).length, 0);
}

function findItem(key) {
  const [cat, name] = key.split("||").map(decodeURIComponent);
  const group = data.find(g => g.category === cat);
  if (!group) return null;
  return group.items.find(i => i.name === name) || null;
}

// ================= 事件 =================
document.getElementById("list").addEventListener("click", e => {
  // 打开物品链接
  const linkBtn = e.target.closest(".link-btn");
  if (linkBtn) {
    e.stopPropagation();
    const url = decodeURIComponent(linkBtn.dataset.link);
    window.open(url, "_blank", "noopener");
    return;
  }
  // 删除整个自定义分类
  const catDel = e.target.closest(".cat-del");
  if (catDel) {
    e.stopPropagation();
    const cat = decodeURIComponent(catDel.dataset.cat);
    if (!confirm("删除分类「" + cat + "」及其全部物品？")) return;
    data = data.filter(g => g.category !== cat);
    populateSelect();
    render();
    showToast("已删除分类");
    return;
  }
  // 编辑物品（名称/链接）
  const editBtn = e.target.closest(".edit");
  if (editBtn) {
    e.stopPropagation();
    editItem(editBtn.dataset.edit);
    return;
  }
  // 删除物品
  const delBtn = e.target.closest(".del");
  if (delBtn) {
    e.stopPropagation();
    const item = findItem(delBtn.dataset.del);
    if (item) {
      const group = data.find(g => g.items.includes(item));
      group.items.splice(group.items.indexOf(item), 1);
      render();
      showToast("已删除");
    }
    return;
  }
  // 勾选
  const itemEl = e.target.closest(".item");
  if (itemEl) {
    const item = findItem(itemEl.dataset.key);
    if (item) {
      item.checked = !item.checked;
      render();
    }
  }
});

function editItem(key) {
  const item = findItem(key);
  if (!item) return;
  const newName = prompt("修改物品名称：", item.name);
  if (newName === null) return;
  const name = newName.trim();
  const newLink = prompt("物品链接（留空表示无链接，点 🔗 可打开）：", item.link || "");
  if (newLink === null) return;
  if (name) item.name = name;
  item.link = normalizeUrl(newLink);
  render();
  showToast("已更新");
}

document.getElementById("filterBtn").addEventListener("click", () => {
  filterOnlyMissing = !filterOnlyMissing;
  document.getElementById("filterBtn").classList.toggle("filter-active", filterOnlyMissing);
  document.getElementById("filterBtn").textContent = filterOnlyMissing ? "显示全部" : "只显示未带";
  render();
});

document.getElementById("searchInput").addEventListener("input", render);

document.getElementById("linkToggle").addEventListener("click", () => {
  const row = document.getElementById("linkRow");
  const on = row.style.display !== "flex";
  row.style.display = on ? "flex" : "none";
  document.getElementById("linkToggle").classList.toggle("active", on);
  if (on) document.getElementById("addLink").focus();
});

document.getElementById("newCatBtn").addEventListener("click", () => {
  const name = prompt("输入新分类名称（如：零食、杂物、礼物）：");
  if (!name || !name.trim()) return;
  const n = name.trim();
  if (data.some(g => g.category === n)) { showToast("该分类已存在"); return; }
  data.push({ category: n, custom: true, items: [] });
  populateSelect();
  document.getElementById("addCategory").value = n;
  render();
  showToast("已新建分类「" + n + "」");
});

document.getElementById("addBtn").addEventListener("click", addItem);
document.getElementById("addInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addItem();
});
document.getElementById("addLink").addEventListener("keydown", e => {
  if (e.key === "Enter") addItem();
});

function addItem() {
  const input = document.getElementById("addInput");
  const name = input.value.trim();
  if (!name) { showToast("请输入物品名称"); return; }
  const cat = document.getElementById("addCategory").value;
  const link = normalizeUrl(document.getElementById("addLink").value);

  let group = data.find(g => g.category === cat);
  if (!group) {
    group = { category: cat, custom: false, items: [] };
    data.push(group);
  }
  if (group.items.some(i => i.name === name)) {
    showToast("该物品已存在");
    return;
  }
  group.items.push({ name, checked: false, link });
  input.value = "";
  document.getElementById("addLink").value = "";
  document.getElementById("linkRow").style.display = "none";
  document.getElementById("linkToggle").classList.remove("active");
  render();
  showToast(link ? "已添加（含链接）：「" + name + "」" : "已添加：「" + name + "」");
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("确定重置所有勾选状态吗？物品列表会保留，只清空勾选。")) return;
  data.forEach(g => g.items.forEach(i => i.checked = false));
  render();
  showToast("已重置勾选");
});

// 日期显示
const now = new Date();
const week = ["日","一","二","三","四","五","六"][now.getDay()];
document.getElementById("dateLine").textContent =
  now.getMonth()+1 + "月" + now.getDate() + "日 星期" + week + " · 出发前检查一下还差什么";

// 让工具条始终紧贴在头部下方（适配不同屏幕/系统字号）
function syncToolbar() {
  const h = document.querySelector("header").offsetHeight;
  document.querySelector(".toolbar").style.top = h + "px";
}
syncToolbar();
window.addEventListener("resize", syncToolbar);

// ================= toast =================
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
</body>
