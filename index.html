<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>开学物品检查清单</title>
<style>
  :root {
    --text: #1a1d2a;
    --text-sub: rgba(26,29,42,.58);
    --primary: #4f6ef7;
    --primary-2: #8a5cf7;
    --danger: #f04b4b;
    --success: #1fce74;
    --glass: rgba(255,255,255,.30);
    --glass-strong: rgba(255,255,255,.46);
    --glass-border: rgba(255,255,255,.58);
    --glass-border-soft: rgba(255,255,255,.34);
    --glass-shadow: 0 10px 30px rgba(70,80,160,.16), inset 0 1px 0 rgba(255,255,255,.65);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f4ff;
      --text-sub: rgba(242,244,255,.58);
      --primary: #7c96ff;
      --primary-2: #b18cff;
      --danger: #ff6b6b;
      --success: #3be08a;
      --glass: rgba(20,24,40,.34);
      --glass-strong: rgba(24,28,46,.5);
      --glass-border: rgba(255,255,255,.22);
      --glass-border-soft: rgba(255,255,255,.12);
      --glass-shadow: 0 12px 34px rgba(0,0,10,.35), inset 0 1px 0 rgba(255,255,255,.18);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 176px;
  }
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1200px 820px at 12% -8%, #ffd9e8 0%, transparent 55%),
      radial-gradient(1000px 720px at 108% 2%, #c9d8ff 0%, transparent 52%),
      radial-gradient(900px 700px at 92% 104%, #e2d4ff 0%, transparent 55%),
      radial-gradient(820px 620px at -8% 104%, #d3f3ff 0%, transparent 55%),
      linear-gradient(165deg, #eef1ff 0%, #f6f0ff 55%, #eef7ff 100%);
  }
  @media (prefers-color-scheme: dark) {
    .bg {
      background:
        radial-gradient(1200px 820px at 12% -8%, rgba(120,60,120,.55) 0%, transparent 55%),
        radial-gradient(1000px 720px at 108% 2%, rgba(60,80,180,.55) 0%, transparent 52%),
        radial-gradient(900px 700px at 92% 104%, rgba(100,60,170,.5) 0%, transparent 55%),
        radial-gradient(820px 620px at -8% 104%, rgba(40,100,140,.5) 0%, transparent 55%),
        linear-gradient(165deg, #14162b 0%, #1a1833 55%, #141d33 100%);
    }
  }
  .orb { position: fixed; border-radius: 50%; z-index: -1; filter: blur(70px); pointer-events: none; }
  .o1 { width: 460px; height: 460px; top: -130px; left: -90px; background: rgba(255,190,215,.55); }
  .o2 { width: 420px; height: 420px; top: 32%; right: -130px; background: rgba(150,180,255,.5); }
  .o3 { width: 500px; height: 500px; bottom: -160px; left: 18%; background: rgba(190,160,255,.5); }
  @media (prefers-color-scheme: dark) {
    .o1 { background: rgba(150,80,150,.5); }
    .o2 { background: rgba(70,100,220,.5); }
    .o3 { background: rgba(120,70,200,.5); }
  }
  body.has-custom-bg .orb { display: none; }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: 24px 20px 16px;
    background: var(--glass);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-bottom: 1px solid var(--glass-border-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
  }
  header h1 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; }
  header .sub { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
  .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .progress-track {
    flex: 1; height: 12px; background: rgba(255,255,255,.5);
    border-radius: 99px; overflow: hidden;
    border: 1px solid var(--glass-border-soft);
  }
  @media (prefers-color-scheme: dark) { .progress-track { background: rgba(255,255,255,.12); } }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    border-radius: 99px;
    transition: width .35s ease;
    box-shadow: 0 0 12px rgba(120,140,255,.6);
  }
  .progress-num { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .toolbar {
    position: sticky; top: 135px; z-index: 9;
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    padding: 12px 14px 10px;
    display: flex; gap: 10px;
    border-bottom: 1px solid var(--glass-border-soft);
  }
  .toolbar .search {
    flex: 1; display: flex; align-items: center;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border-radius: 16px; padding: 0 12px;
    border: 1px solid var(--glass-border-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }
  .toolbar .search input {
    flex: 1; border: none; outline: none; font-size: 15px; padding: 11px 8px;
    background: transparent; color: var(--text);
  }
  .toolbar .search input::placeholder { color: var(--text-sub); }
  .toolbar .search .icon { font-size: 15px; color: var(--text-sub); }
  .toolbar button {
    border: 1px solid var(--glass-border-soft); border-radius: 16px;
    font-size: 14px; font-weight: 700; padding: 0 16px; cursor: pointer;
    background: var(--glass); color: var(--text);
    backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }
  .toolbar button.filter-active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(110,120,255,.35);
  }
  .bg-btn {
    position: absolute; top: 16px; right: 16px;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--glass-border-soft);
    background: var(--glass);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    font-size: 18px; cursor: pointer; line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(70,80,160,.14);
    display: flex; align-items: center; justify-content: center;
  }
  .bg-btn:active { transform: scale(.92); }
  .bg-panel {
    position: fixed; top: 100px; right: 14px; z-index: 40;
    width: 268px;
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: 0 16px 48px rgba(70,80,160,.25), inset 0 1px 0 rgba(255,255,255,.7);
    padding: 16px;
    transition: opacity .18s ease, transform .18s ease;
  }
  .bg-panel.hidden { opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none; }
  .bg-panel h3 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .bg-panel .hint { font-size: 11px; color: var(--text-sub); margin-top: 8px; line-height: 1.5; }
  .bg-panel .row { display: flex; gap: 8px; margin-top: 10px; }
  .bg-panel .row input {
    flex: 1; min-width: 0; height: 40px; border-radius: 12px;
    border: 1px solid var(--glass-border-soft); background: rgba(255,255,255,.28);
    padding: 0 10px; font-size: 13px; color: var(--text); outline: none;
  }
  .bg-panel .row input::placeholder { color: var(--text-sub); }
  @media (prefers-color-scheme: dark) { .bg-panel .row input { background: rgba(255,255,255,.08); } }
  .bg-panel .btn {
    height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
    backdrop-filter: blur(12px);
  }
  .bg-panel .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; border-color: transparent;
  }
  .bg-panel .btn.block { width: 100%; margin-top: 10px; }
  .bg-panel .btn:active { transform: scale(.97); }
  main { padding: 10px 14px 20px; }
  .category { margin-top: 18px; }
  .category-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 800; letter-spacing: -.2px;
    margin-bottom: 10px; padding: 0 6px;
  }
  .category-title .badge {
    font-size: 11px; font-weight: 700; color: var(--text-sub);
    background: var(--glass); border: 1px solid var(--glass-border-soft);
    border-radius: 99px; padding: 3px 10px;
    backdrop-filter: blur(16px);
  }
  .category-title .badge.all-done { background: rgba(31,206,116,.16); color: var(--success); border-color: rgba(31,206,116,.3); }
  .category-title .badge.has-missing { background: rgba(240,75,75,.12); color: var(--danger); border-color: rgba(240,75,75,.28); }
  .category-title .cat-del {
    margin-left: auto; border: none; background: transparent;
    color: var(--text-sub); font-size: 14px; cursor: pointer; padding: 4px 8px;
  }
  .category-title .cat-del:hover { color: var(--danger); }
  .item {
    display: flex; flex-direction: row; align-items: center; gap: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.52), rgba(255,255,255,.24));
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 15px 16px; margin-bottom: 10px;
    box-shadow: var(--glass-shadow);
    transition: transform .08s ease, box-shadow .15s ease;
    cursor: pointer; user-select: none;
    position: relative;
  }
  .item-row { display: flex; align-items: center; gap: 13px; flex: 1; min-width: 0; }
  .item-img-wrap { position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .item-img {
    max-height: 108px; max-width: 132px; width: auto; height: auto;
    border-radius: 14px;
    border: 1px solid var(--glass-border-soft);
    box-shadow: 0 6px 16px rgba(70,80,160,.22);
    cursor: zoom-in; object-fit: cover;
    background: rgba(255,255,255,.2);
  }
  .img-del {
    position: absolute; top: -7px; right: -7px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(20,22,34,.85); color: #fff; border: 1px solid rgba(255,255,255,.3);
    font-size: 11px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  .img-del:hover { background: var(--danger); }
  .item:active { transform: scale(.975); }
  .item .box {
    width: 26px; height: 26px; flex-shrink: 0;
    border: 2px solid rgba(90,100,150,.4); border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.3);
    transition: all .2s ease;
  }
  .item.checked .box {
    background: linear-gradient(135deg, var(--success), #22e08b);
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(31,206,116,.4);
  }
  .item.checked .box svg { stroke-dasharray: 24; stroke-dashoffset: 0; }
  .item .name { font-size: 15px; flex: 1; word-break: break-all; font-weight: 500; }
  .item.checked .name { color: var(--text-sub); text-decoration: line-through; }
  .item .box svg {
    width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2;
    fill: none; stroke-dasharray: 24; stroke-dashoffset: 24;
    transition: stroke-dashoffset .2s ease;
  }
  .item .link-btn {
    border: 1px solid var(--glass-border-soft); background: rgba(255,255,255,.4);
    backdrop-filter: blur(14px);
    border-radius: 10px; font-size: 15px; padding: 5px 8px; cursor: pointer; flex-shrink: 0;
    line-height: 1;
  }
  .item .link-btn:active { background: rgba(255,255,255,.7); }
  .item .link-btn.no-link { border-style: dashed; opacity: .75; }
  .more-btn {
    border: 1px solid var(--glass-border-soft); background: rgba(255,255,255,.4);
    backdrop-filter: blur(14px);
    border-radius: 10px; font-size: 16px; padding: 5px 8px; cursor: pointer; flex-shrink: 0;
    line-height: 1; color: var(--text-sub); font-weight: 700; letter-spacing: 1px;
  }
  .more-btn:active { background: rgba(255,255,255,.7); }
  .more-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; border-color: transparent;
  }
  .context-menu {
    position: fixed; z-index: 50;
    min-width: 170px;
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(70,80,160,.28), inset 0 1px 0 rgba(255,255,255,.7);
    padding: 6px;
    opacity: 0; transform: translateY(-4px) scale(.97);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .context-menu.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .context-menu .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 11px;
    font-size: 14px; font-weight: 600; color: var(--text);
    cursor: pointer; transition: background .1s ease;
    border: none; background: none; width: 100%; text-align: left;
  }
  .context-menu .menu-item:hover { background: rgba(255,255,255,.35); }
  .context-menu .menu-item:active { background: rgba(255,255,255,.5); }
  @media (prefers-color-scheme: dark) { .context-menu .menu-item:hover { background: rgba(255,255,255,.1); } }
  .context-menu .menu-item .mi-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
  .context-menu .menu-item.danger { color: var(--danger); }
  .context-menu .menu-sep { height: 1px; background: var(--glass-border-soft); margin: 4px 8px; }
  @media (prefers-color-scheme: dark) {
    .item { background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06)); }
    .item .box { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.08); }
    .item .link-btn { background: rgba(255,255,255,.1); }
    .more-btn { background: rgba(255,255,255,.1); }
  }
  .empty { text-align: center; color: var(--text-sub); font-size: 14px; padding: 56px 20px; }
  .empty .big { font-size: 46px; margin-bottom: 12px; }
  .empty .highlight { color: var(--success); font-weight: 800; }
  .addbar {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow: 0 14px 44px rgba(70,80,160,.24), inset 0 1px 0 rgba(255,255,255,.7);
    padding: 12px;
  }
  .addbar-row1 { display: flex; gap: 8px; align-items: center; }
  .addbar-row2 {
    display: none; gap: 8px; align-items: center; margin-top: 9px;
    background: rgba(255,255,255,.22);
    backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border-soft);
    border-radius: 14px; padding: 8px 10px;
  }
  @media (prefers-color-scheme: dark) { .addbar-row2 { background: rgba(255,255,255,.08); } }
  .addbar-row2 .hint { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
  .add-select {
    border: 1px solid var(--glass-border-soft); border-radius: 16px;
    background: var(--glass); color: var(--text);
    padding: 0 8px; font-size: 14px; height: 48px; outline: none;
    max-width: 118px; flex-shrink: 0;
    backdrop-filter: blur(16px);
  }
  .newcat-btn {
    border: 1px dashed rgba(110,120,255,.6); border-radius: 16px;
    background: var(--glass); color: var(--primary); font-size: 13px; font-weight: 700;
    height: 48px; padding: 0 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    backdrop-filter: blur(16px);
  }
  .newcat-btn:active { background: var(--glass-strong); }
  .add-input {
    flex: 1; height: 48px; border: 1px solid var(--glass-border-soft); border-radius: 16px;
    padding: 0 14px; font-size: 15px; outline: none; color: var(--text); min-width: 0;
    background: rgba(255,255,255,.28);
    backdrop-filter: blur(16px);
  }
  .add-input::placeholder { color: var(--text-sub); }
  .add-input:focus { border-color: var(--primary); }
  @media (prefers-color-scheme: dark) { .add-input { background: rgba(255,255,255,.08); } }
  .link-toggle {
    width: 48px; height: 48px; flex-shrink: 0;
    border: 1px solid var(--glass-border-soft); border-radius: 16px;
    background: var(--glass); font-size: 18px; cursor: pointer;
    backdrop-filter: blur(16px);
  }
  .link-toggle.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent; color: #fff;
  }
  .link-input {
    flex: 1; height: 42px; border: 1px solid var(--glass-border-soft); border-radius: 12px;
    padding: 0 12px; font-size: 14px; outline: none; color: var(--text); min-width: 0;
    background: rgba(255,255,255,.28);
  }
  .link-input:focus { border-color: var(--primary); }
  @media (prefers-color-scheme: dark) { .link-input { background: rgba(255,255,255,.08); } }
  .add-btn {
    height: 48px; padding: 0 22px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 8px 22px rgba(110,120,255,.4);
  }
  .add-btn:active { transform: scale(.96); }
  .reset-btn {
    display: block; margin: 26px auto 0; border: 1px solid var(--glass-border-soft);
    background: var(--glass); color: var(--text-sub); font-size: 13px; font-weight: 600;
    padding: 11px 24px; border-radius: 99px; cursor: pointer;
    backdrop-filter: blur(18px);
  }
  .reset-btn:hover { color: var(--danger); border-color: var(--danger); }
  .toast {
    position: fixed; left: 50%; bottom: 148px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,22,34,.78); color: #fff; font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 99px; opacity: 0;
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.18);
    transition: all .25s ease; pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 480px) {
    header { padding: 18px 14px 12px; }
    header h1 { font-size: 22px; }
    header .sub { font-size: 12px; }
    .progress-row { gap: 8px; margin-top: 10px; }
    .progress-num { font-size: 12px; }
    .toolbar { padding: 10px 10px 8px; gap: 8px; }
    .toolbar .search input { font-size: 14px; padding: 9px 6px; }
    .toolbar button { font-size: 13px; padding: 0 12px; border-radius: 14px; }
    main { padding: 8px 10px 16px; }
    .category { margin-top: 14px; }
    .category-title { font-size: 14px; margin-bottom: 8px; }
    .item { gap: 10px; padding: 12px 13px; border-radius: 18px; }
    .item-row { gap: 8px; }
    .item-img { max-height: 84px; max-width: 96px; border-radius: 12px; }
    .item .name { font-size: 14px; }
    .item .box { width: 24px; height: 24px; border-radius: 8px; }
    .item .link-btn { font-size: 14px; padding: 4px 6px; border-radius: 9px; }
    .more-btn { font-size: 14px; padding: 4px 6px; border-radius: 9px; }
    .img-del { width: 20px; height: 20px; font-size: 10px; top: -6px; right: -6px; }
    .context-menu { min-width: 155px; border-radius: 14px; padding: 5px; }
    .context-menu .menu-item { padding: 10px 12px; font-size: 13px; border-radius: 10px; }
    .addbar { left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); padding: 10px; border-radius: 22px; }
    .addbar-row1 { gap: 6px; }
    .add-select { max-width: 88px; height: 44px; font-size: 12px; padding: 0 6px; border-radius: 14px; }
    .newcat-btn { height: 44px; font-size: 12px; padding: 0 8px; border-radius: 14px; }
    .add-input { height: 44px; font-size: 14px; padding: 0 12px; border-radius: 14px; }
    .link-toggle { width: 44px; height: 44px; font-size: 16px; border-radius: 14px; }
    .add-btn { height: 44px; padding: 0 18px; font-size: 15px; border-radius: 14px; }
    .addbar-row2 { margin-top: 8px; padding: 7px 8px; border-radius: 12px; }
    .link-input { height: 38px; font-size: 13px; }
    .addbar-row2 .hint { font-size: 10px; }
    .reset-btn { margin-top: 20px; font-size: 12px; padding: 9px 20px; }
    .toast { bottom: 130px; font-size: 12px; padding: 9px 16px; }
    body { padding-bottom: 160px; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="orb o1" aria-hidden="true"></div>
<div class="orb o2" aria-hidden="true"></div>
<div class="orb o3" aria-hidden="true"></div>
<header>
  <h1>🎒 开学物品检查清单</h1>
  <div class="sub" id="dateLine"></div>
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-num" id="progressNum">0/0</div>
  </div>
  <button class="bg-btn" id="bgBtn" title="自定义背景">🎨</button>
</header>
<div class="toolbar">
  <div class="search">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索物品…" />
  </div>
  <button id="filterBtn">只显示未带</button>
</div>
<main id="list"></main>
<button class="reset-btn" id="resetBtn">重置所有勾选</button>
<div class="addbar">
  <div class="addbar-row1">
    <select class="add-select" id="addCategory"></select>
    <button class="newcat-btn" id="newCatBtn" title="新建自己的分类">＋新分类</button>
    <input class="add-input" id="addInput" placeholder="添加物品，如：耳机" maxlength="30" />
    <button class="link-toggle" id="linkToggle" title="给物品添加链接">🔗</button>
    <button class="add-btn" id="addBtn">＋</button>
  </div>
  <div class="addbar-row2" id="linkRow">
    <input class="link-input" id="addLink" placeholder="粘贴物品链接（如淘宝/参考网址）" />
    <span class="hint">添加后点物品上的 🔗 可直接打开</span>
  </div>
</div>
<div class="bg-panel hidden" id="bgPanel">
  <h3>自定义背景</h3>
  <div class="hint">选一张图片做背景，玻璃卡片会直接透出它。</div>
  <button class="btn block" id="bgUploadBtn">📁 上传图片</button>
  <input type="file" id="bgFile" accept="image/*" style="display:none" />
  <div class="row">
    <input id="bgUrl" placeholder="或粘贴图片链接…" />
    <button class="btn primary" id="bgUrlApply">应用</button>
  </div>
  <button class="btn block" id="bgReset">恢复默认渐变</button>
  <div class="hint">图片仅保存在浏览器本地，不上传服务器。</div>
</div>
<div class="context-menu" id="contextMenu"></div>
<input type="file" id="itemImageFile" accept="image/*" style="display:none" />
<div class="toast" id="toast"></div>
<script>
const DEFAULT_DATA = [
  { category: "📄 证件资料", items: ["身份证","学生证","校园卡/一卡通","银行卡","证件照（一寸/两寸）","录取通知书/报到材料","团员证/党团材料","档案材料","体检报告"]},
  { category: "🔌 电子产品", items: ["手机","手机充电器","数据线","充电宝","耳机","笔记本电脑","电脑充电器","平板/电子书","U盘/硬盘","鼠标"]},
  { category: "👕 衣物", items: ["换洗外套","日常衣物","睡衣","内衣裤","袜子","运动鞋","拖鞋","换季薄外套"]},
  { category: "🧴 洗漱用品", items: ["牙刷","牙膏","洗面奶","洗发水","沐浴露","毛巾/浴巾","梳子","剃须刀/化妆包"]},
  { category: "🛏️ 宿舍用品", items: ["床单被套","枕头","被子","枕头套","衣架","台灯","插线板","垃圾桶/垃圾袋","小锁"]},
  { category: "✏️ 学习用品", items: ["笔记本","签字笔","课本/教材","文具袋","计算器","便利贴"]},
  { category: "💊 药品", items: ["感冒药","肠胃药","创可贴","退烧药","常用药（个人）"]},
  { category: "🧺 日常用品", items: ["水杯","雨伞","纸巾/湿巾","指甲剪","钥匙","口罩","收纳盒/收纳袋","饭盒/餐具"]}
];
const STORAGE_KEY = "school-pack-checklist-v1";
let data = loadData();
let filterOnlyMissing = false;
let activeMenuKey = null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]));}
function normalizeUrl(u){u=(u||"").trim();if(!u)return null;if(!/^https?:\/\//i.test(u))u="https://"+u;return u;}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed)){parsed.forEach(g=>{if(g.custom===undefined)g.custom=false;g.items.forEach(i=>{if(i.link===undefined)i.link=null;if(i.image===undefined)i.image=null;});});return parsed;}}}catch(e){}
const d=DEFAULT_DATA.map(g=>({category:g.category,custom:false,items:g.items.map(n=>({name:n,checked:false,link:null,image:null}))}));saveData(d);return d;}
function saveData(d){const payload=d||data;localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));}
function populateSelect(){const sel=document.getElementById("addCategory");const prev=sel.value;sel.innerHTML="";data.forEach(g=>{const o=document.createElement("option");o.value=g.category;o.textContent=g.category;sel.appendChild(o);});if(prev&&data.some(g=>g.category===prev))sel.value=prev;}
function render(){const listEl=document.getElementById("list");const kw=document.getElementById("searchInput").value.trim().toLowerCase();const total=countAll();const done=countDone();
document.getElementById("progressFill").style.width=total===0?"0%":(done/total*100)+"%";
document.getElementById("progressNum").textContent=done+"/"+total+(total-done>0?" · 还有 "+(total-done)+" 件未带":" · 全部带齐 ✅");
populateSelect();let html="";data.forEach(group=>{const filtered=group.items.filter(it=>{if(filterOnlyMissing&&it.checked)return false;if(kw&&!it.name.toLowerCase().includes(kw))return false;return true;});if(filtered.length===0)return;const missing=filtered.filter(it=>!it.checked).length;const allDone=missing===0;
html+='<div class="category">';html+='<div class="category-title"><span>'+esc(group.category)+'</span>';
html+='<span class="badge '+(allDone?"all-done":"has-missing")+'">'+(allDone?"✓ 已带齐":"未带 "+missing+" 件")+'</span>';
if(group.custom){html+='<button class="cat-del" data-cat="'+encodeURIComponent(group.category)+'" title="删除该分类">✕</button>';}
html+='</div>';filtered.forEach(it=>{const key=encodeURIComponent(group.category)+"||"+encodeURIComponent(it.name);const isMenuActive=activeMenuKey===key;
html+='<div class="item '+(it.checked?"checked":"")+'" data-key="'+key+'">';
if(it.image){html+='<div class="item-img-wrap">';html+='<img class="item-img" src="'+esc(it.image)+'" alt="'+esc(it.name)+'" />';html+='<button class="img-del" data-imgdel="'+key+'" title="删除图片">✕</button></div>';}
html+='<div class="item-row">';html+='<div class="box"><svg viewBox="0 0 24 24"><polyline points="4,12 9,17 20,6" /></svg></div>';html+='<div class="name"></div>';
html+='<button class="link-btn '+(it.link?'has-link':'no-link')+'" '+(it.link?'data-link="'+encodeURIComponent(it.link)+'"':'')+' data-key="'+key+'" title="'+(it.link?'点击打开链接':'点击添加链接')+'">'+(it.link?'🔗':'＋🔗')+'</button>';
html+='<button class="more-btn '+(isMenuActive?'active':'')+'" data-more="'+key+'" title="更多操作">⋯</button>';
html+='</div></div>';});html+='</div>';});
if(html===""){const allChecked=total>0&&done===total;html='<div class="empty"><div class="big">'+(allChecked?"🎉":"🔍")+'</div>'+(allChecked?'所有物品都带齐啦！<br><span class="highlight">可以安心出发~</span>':'没有符合条件的物品，试试换个关键词或取消筛选。')+'</div>';}
listEl.innerHTML=html;listEl.querySelectorAll(".item .name").forEach(el=>{const key=decodeURIComponent(el.closest(".item").dataset.key);const name=key.split("||").pop();el.textContent=name;});saveData();}
function countAll(){return data.reduce((s,g)=>s+g.items.length,0);}
function countDone(){return data.reduce((s,g)=>s+g.items.filter(i=>i.checked).length,0);}
function findItem(key){const[cat,name]=key.split("||").map(decodeURIComponent);const group=data.find(g=>g.category===cat);if(!group)return null;return group.items.find(i=>i.name===name)||null;}
function showContextMenu(key,anchorEl){const menu=document.getElementById("contextMenu");const item=findItem(key);if(!item)return;activeMenuKey=key;
let html='';html+='<button class="menu-item" data-action="edit"><span class="mi-icon">✎</span>编辑名称</button>';
html+='<button class="menu-item" data-action="link"><span class="mi-icon">🔗</span>'+(item.link?'修改链接':'添加链接')+'</button>';
html+='<button class="menu-item" data-action="image"><span class="mi-icon">🖼️</span>'+(item.image?'更换图片':'上传图片')+'</button>';
if(item.image){html+='<button class="menu-item" data-action="removeimg"><span class="mi-icon">🗑️</span>移除图片</button>';}
html+='<div class="menu-sep"></div>';html+='<button class="menu-item danger" data-action="delete"><span class="mi-icon">✕</span>删除物品</button>';
menu.innerHTML=html;const rect=anchorEl.getBoundingClientRect();const menuWidth=175;let left=rect.right-menuWidth+8;let top=rect.bottom+6;
if(left+menuWidth>window.innerWidth-10){left=window.innerWidth-menuWidth-10;}if(left<10)left=10;
const menuHeight=240;if(top+menuHeight>window.innerHeight-10){top=rect.top-menuHeight-6;}
menu.style.left=left+"px";menu.style.top=top+"px";menu.classList.add("show");
menu.querySelectorAll(".menu-item").forEach(btn=>{btn.onclick=()=>{const action=btn.dataset.action;handleMenuAction(action,key);hideContextMenu();};});
render();}
function hideContextMenu(){const menu=document.getElementById("contextMenu");menu.classList.remove("show");if(activeMenuKey!==null){activeMenuKey=null;render();}}
function handleMenuAction(action,key){const item=findItem(key);if(!item)return;const group=data.find(g=>g.items.includes(item));
if(action==="edit"){const newName=prompt("修改物品名称：",item.name);if(newName===null)return;const name=newName.trim();const newLink=prompt("物品链接（当前："+(item.link||"无")+"，可修改；清空后点确定可移除链接）：",item.link||"");if(newLink===null)return;if(name)item.name=name;item.link=normalizeUrl(newLink);render();showToast("已更新");}
else if(action==="link"){if(item.link){const choice=confirm("当前已有链接，点击确定打开链接，点击取消修改链接。\n\n链接："+item.link);if(choice){window.open(item.link,"_blank","noopener");}else{const newLink=prompt("修改物品链接（清空后点确定可移除）：",item.link);if(newLink!==null){item.link=normalizeUrl(newLink);render();showToast(newLink.trim()?"链接已更新":"链接已移除");}}}else{const newLink=prompt("添加物品链接（粘贴淘宝/参考网址）：","");if(newLink!==null&&newLink.trim()){item.link=normalizeUrl(newLink);render();showToast("链接已添加");}}}
else if(action==="image"){currentImageKey=key;document.getElementById("itemImageFile").click();}
else if(action==="removeimg"){item.image=null;render();showToast("已移除图片");}
else if(action==="delete"){if(!confirm("删除物品「"+item.name+"」？"))return;group.items.splice(group.items.indexOf(item),1);render();showToast("已删除");}}
document.getElementById("list").addEventListener("click",e=>{
const moreBtn=e.target.closest(".more-btn");if(moreBtn){e.stopPropagation();const key=moreBtn.dataset.more;if(activeMenuKey===key){hideContextMenu();}else{showContextMenu(key,moreBtn);}return;}
const linkBtn=e.target.closest(".link-btn");if(linkBtn){e.stopPropagation();hideContextMenu();const url=linkBtn.dataset.link;if(url){window.open(decodeURIComponent(url),"_blank","noopener");}else{const key=linkBtn.dataset.key;const item=findItem(key);if(item){const newLink=prompt("添加物品链接（粘贴淘宝/参考网址，留空取消）：","");if(newLink!==null&&newLink.trim()){item.link=normalizeUrl(newLink);render();showToast("链接已添加");}}}return;}
const imgDel=e.target.closest(".img-del");if(imgDel){e.stopPropagation();hideContextMenu();const item=findItem(imgDel.dataset.imgdel);if(item){item.image=null;render();showToast("已删除图片");}return;}
const imgEl=e.target.closest(".item-img");if(imgEl){e.stopPropagation();hideContextMenu();if(imgEl.src)window.open(imgEl.src,"_blank","noopener");return;}
const catDel=e.target.closest(".cat-del");if(catDel){e.stopPropagation();hideContextMenu();const cat=decodeURIComponent(catDel.dataset.cat);if(!confirm("删除分类「"+cat+"」及其全部物品？"))return;data=data.filter(g=>g.category!==cat);populateSelect();render();showToast("已删除分类");return;}
const itemEl=e.target.closest(".item");if(itemEl){hideContextMenu();const item=findItem(itemEl.dataset.key);if(item){item.checked=!item.checked;render();}}});
document.addEventListener("click",e=>{if(!e.target.closest(".context-menu")&&!e.target.closest(".more-btn")){if(activeMenuKey!==null)hideContextMenu();}});
let currentImageKey=null;
function compressItemImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let{width,height}=img;const maxW=720;const scale=Math.min(1,maxW/width);width=Math.round(width*scale);height=Math.round(height*scale);const c=document.createElement("canvas");c.width=width;c.height=height;c.getContext("2d").drawImage(img,0,0,width,height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",0.72));};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("图片加载失败"));};img.src=url;});}
document.getElementById("itemImageFile").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file||!currentImageKey)return;try{const data=await compressItemImage(file);const item=findItem(currentImageKey);if(item){item.image=data;render();showToast("图片已添加");}}catch(err){showToast("图片处理失败，请换一张试试");}currentImageKey=null;});
document.getElementById("filterBtn").addEventListener("click",()=>{filterOnlyMissing=!filterOnlyMissing;document.getElementById("filterBtn").classList.toggle("filter-active",filterOnlyMissing);document.getElementById("filterBtn").textContent=filterOnlyMissing?"显示全部":"只显示未带";render();});
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("linkToggle").addEventListener("click",()=>{const row=document.getElementById("linkRow");const on=row.style.display!=="flex";row.style.display=on?"flex":"none";document.getElementById("linkToggle").classList.toggle("active",on);if(on)document.getElementById("addLink").focus();});
document.getElementById("newCatBtn").addEventListener("click",()=>{const name=prompt("输入新分类名称（如：零食、杂物、礼物）：");if(!name||!name.trim())return;const n=name.trim();if(data.some(g=>g.category===n)){showToast("该分类已存在");return;}data.push({category:n,custom:true,items:[]});populateSelect();document.getElementById("addCategory").value=n;render();showToast("已新建分类「"+n+"」");});
document.getElementById("addBtn").addEventListener("click",addItem);
document.getElementById("addInput").addEventListener("keydown",e=>{if(e.key==="Enter")addItem();});
document.getElementById("addLink").addEventListener("keydown",e=>{if(e.key==="Enter")addItem();});
function addItem(){const input=document.getElementById("addInput");const name=input.value.trim();if(!name){showToast("请输入物品名称");return;}const cat=document.getElementById("addCategory").value;const link=normalizeUrl(document.getElementById("addLink").value);let group=data.find(g=>g.category===cat);if(!group){group={category:cat,custom:false,items:[]};data.push(group);}if(group.items.some(i=>i.name===name)){showToast("该物品已存在");return;}group.items.push({name,checked:false,link,image:null});input.value="";document.getElementById("addLink").value="";document.getElementById("linkRow").style.display="none";document.getElementById("linkToggle").classList.remove("active");render();showToast(link?"已添加（含链接）：「"+name+"」":"已添加：「"+name+"」");}
document.getElementById("resetBtn").addEventListener("click",()=>{if(!confirm("确定重置所有勾选状态吗？物品列表会保留，只清空勾选。"))return;data.forEach(g=>g.items.forEach(i=>i.checked=false));render();showToast("已重置勾选");});
const BG_KEY="school-pack-bg-v1";const bgEl=document.querySelector(".bg");
function applyBg(bg){if(bg&&bg.kind==="image"){bgEl.style.backgroundImage='url("'+bg.data+'")';bgEl.style.backgroundSize="cover";bgEl.style.backgroundPosition="center";document.body.classList.add("has-custom-bg");}else{bgEl.style.backgroundImage="";bgEl.style.backgroundSize="";bgEl.style.backgroundPosition="";document.body.classList.remove("has-custom-bg");}}
function saveBg(bg){localStorage.setItem(BG_KEY,JSON.stringify(bg));applyBg(bg);}
function loadBg(){try{const raw=localStorage.getItem(BG_KEY);if(raw){const bg=JSON.parse(raw);if(bg&&bg.kind==="image")applyBg(bg);}}catch(e){}}
function compressImage(file,maxDim,quality){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let{width,height}=img;const scale=Math.min(1,maxDim/Math.max(width,height));width=Math.round(width*scale);height=Math.round(height*scale);const c=document.createElement("canvas");c.width=width;c.height=height;c.getContext("2d").drawImage(img,0,0,width,height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",quality));};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("图片加载失败"));};img.src=url;});}
const bgPanel=document.getElementById("bgPanel");
document.getElementById("bgBtn").addEventListener("click",e=>{e.stopPropagation();bgPanel.classList.toggle("hidden");});
document.addEventListener("click",e=>{if(!bgPanel.classList.contains("hidden")&&!e.target.closest("#bgPanel")&&!e.target.closest("#bgBtn")){bgPanel.classList.add("hidden");}});
document.getElementById("bgUploadBtn").addEventListener("click",()=>{document.getElementById("bgFile").click();});
document.getElementById("bgFile").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;try{const data=await compressImage(file,1600,0.82);saveBg({kind:"image",data});bgPanel.classList.add("hidden");showToast("背景已更新");}catch(err){showToast("图片处理失败，请换一张试试");}});
document.getElementById("bgUrlApply").addEventListener("click",()=>{const inp=document.getElementById("bgUrl");const url=inp.value.trim();if(!/^https?:\/\/[^\s"'<>\\]+$/i.test(url)){showToast("请输入以 http(s):// 开头的图片链接");return;}saveBg({kind:"image",data:url});inp.value="";bgPanel.classList.add("hidden");showToast("背景已更新");});
document.getElementById("bgReset").addEventListener("click",()=>{localStorage.removeItem(BG_KEY);applyBg(null);bgPanel.classList.add("hidden");showToast("已恢复默认渐变");});
const now=new Date();const week=["日","一","二","三","四","五","六"][now.getDay()];
document.getElementById("dateLine").textContent=now.getMonth()+1+"月"+now.getDate()+"日 星期"+week+" · 出发前检查一下还差什么";
function syncToolbar(){const h=document.querySelector("header").offsetHeight;document.querySelector(".toolbar").style.top=h+"px";}
syncToolbar();window.addEventListener("resize",syncToolbar);
let toastTimer=null;
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800);}
render();loadBg();
</script>
</body>
</html>
